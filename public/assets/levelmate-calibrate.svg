  <rect x="275" y="174" width="97" height="66" rx="9" fill="#a6cbc3" stroke="#507f74" stroke-width="4"/>
  <rect x="417" y="174" width="112" height="141" rx="8" fill="#d8ddd1" stroke="#648476" stroke-width="4"/>
